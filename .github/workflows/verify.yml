name: Verify published static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  site-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tools/check_site.py
